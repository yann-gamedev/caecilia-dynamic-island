<style>
/* Layout: one working canvas (monitor top-edge stage + inspector), then a stacked handoff sheet. Committed single dark world: the island lives on OLED black. */
:root {
  --bg: #07080A;
  --bg-2: #0C0E11;
  --panel: #101318;
  --line: rgba(150, 185, 210, 0.10);
  --line-2: rgba(150, 185, 210, 0.20);
  --fg: #E6E9ED;
  --muted: #8C949D;
  --dim: #5A626B;
  --accent: #38BDF8;
  --aqua: #00FFFF;
  --focus: #FF9F0A;
  --ui: "Inter", "SF Pro Text", "Segoe UI Variable Text", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --island-ui: "SF Pro Display", "SF Pro Text", -apple-system, "Inter", "Segoe UI Variable Display", system-ui, sans-serif;
  --island-serif: "New York", "New York Medium", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px; -webkit-font-smoothing: antialiased; }
.page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; max-width: 1320px; margin: 0 auto; }
h1, h2, h3 { text-wrap: balance; }
.eyebrow { font: 600 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; }
.seg button { font: 500 12px/1 var(--ui); color: var(--muted); padding: 8px 11px; border-radius: 7px; display: inline-flex; gap: 7px; align-items: baseline; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: rgba(56,189,248,.12); color: var(--fg); box-shadow: inset 0 0 0 1px rgba(56,189,248,.35); }
.seg button .k { font: 500 10px/1 var(--mono); color: var(--dim); }
.seg button[aria-pressed="true"] .k { color: var(--accent); }
.chip { font: 500 12px/1 var(--ui); color: var(--muted); padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); }
.chip:hover { color: var(--fg); border-color: var(--line-2); }
.chip[aria-pressed="true"] { color: var(--fg); border-color: rgba(56,189,248,.45); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select.chip { appearance: none; padding-right: 24px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }

.stage-scroll { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); background: #000; }
.stage { position: relative; }
.bezel { position: absolute; left: 0; right: 0; top: 0; height: 14px; background: #000; z-index: 0; }
.screen { position: absolute; left: 0; right: 0; top: 14px; bottom: 0; overflow: hidden;
  background:
    radial-gradient(120% 90% at 18% 110%, rgba(20, 70, 96, .55), transparent 60%),
    radial-gradient(90% 80% at 85% 0%, rgba(40, 46, 92, .45), transparent 55%),
    linear-gradient(180deg, #0B1016, #070A0E); }
.screen.grid::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-position: center top; }

table.spec { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.spec th { text-align: left; font: 600 10px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 10px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }

const { useState, useEffect, useRef, useMemo } = React;

/* ============================================================

const STATES = {

  hud:      { id: 'hud',      n: 4, name: 'System HUD',         w: 200, h: 44,  rb: 22, ear: 10, mix: 0, rim: 0.75, shadow: 0.4  },

const STATE_ORDER = ['idle', 'compact', 'expanded', 'hud'];

const COLORS = [
  { id: 'core',     name: 'Core',            hex: '#000000', a: 1,    use: 'Surface for Dormant, Compact and HUD. Matches the bezel.' },
  { id: 'obsidian', name: 'Obsidian',        hex: '#0C0C0E', a: 0.92, use: 'Surface for Expanded. Interpolated from Core by the "mix" spring.' },
  { id: 'rim',      name: 'Specular rim',    hex: '#FFFFFF', a: 0.12, use: '1px inner border. Alpha 0.12 at y = 0 fading to 0.04 at y = H. Scaled by the "rim" spring.' },
  { id: 'aqua',     name: 'Aqua',            hex: '#00FFFF', a: 1,    use: 'Accent gradient start (top of bars, status dot).' },
  { id: 'sky',      name: 'Sky',             hex: '#38BDF8', a: 1,    use: 'Primary accent: progress fills, rings, gradient end.' },
  { id: 'glow',     name: 'Sky glow',        hex: '#38BDF8', a: 0.45, use: 'Glow behind accent marks. Gaussian blur σ ≈ 3 DIP.' },
  { id: 'label',    name: 'Label primary',   hex: '#F5F5F7', a: 1,    use: 'Titles, values, glyphs.' },
  { id: 'label2',   name: 'Label secondary', hex: '#EBEBF5', a: 0.60, use: 'Artist, clock, secondary values.' },
  { id: 'label3',   name: 'Label tertiary',  hex: '#EBEBF5', a: 0.30, use: 'Micro labels, timestamps, dashed tray stroke.' },

  { id: 'lens',     name: 'Camera lens',     hex: '#0A0A12', a: 1,    use: 'Dormant camera glyph fill.' },
  { id: 'lensRing', name: 'Lens ring',       hex: '#1C1C26', a: 1,    use: 'Dormant camera glyph 1px stroke.' },

  { id: 'shadow',   name: 'Drop shadow',     hex: '#000000', a: 0.55, use: 'Offset (0, 12), blur 32. Scaled by the "shadow" spring.' },

const CMAP = Object.fromEntries(COLORS.map(c => [c.id, c]));
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

const TYPE = [
  { role: 'Tab label / clock', mac: 'SF Pro Text', win: 'Segoe UI Variable Text', size: 11,   weight: 600, lh: 14, track: '+0.1', color: 'label' },
  { role: 'Media title',       mac: 'New York',    win: 'Georgia',                size: 15,   weight: 600, lh: 18, track: '-0.2', color: 'label' },
  { role: 'Artist',            mac: 'SF Pro Text', win: 'Segoe UI Variable Text', size: 12,   weight: 500, lh: 14, track: '0',    color: 'label2' },
  { role: 'Timestamp',         mac: 'SF Pro Text', win: 'Segoe UI Variable Text', size: 10,   weight: 500, lh: 11, track: '0 · tabular', color: 'label3' },
  { role: 'Telemetry value',   mac: 'SF Pro Display', win: 'Segoe UI Variable Display', size: 11, weight: 600, lh: 12, track: '0 · tabular', color: 'label' },
  { role: 'Micro label',       mac: 'SF Pro Text', win: 'Segoe UI Variable Small', size: 9.5, weight: 600, lh: 11, track: '+0.6 · caps', color: 'label3' },

const SPRINGS = [
  { id: 'idleToCompact', name: 'IdleToCompact',  label: 'Dormant → Compact',          response: 0.42, zeta: 0.80 },
  { id: 'toExpanded',    name: 'ToExpanded',     label: 'Dormant / Compact → Expanded', response: 0.48, zeta: 0.74 },
  { id: 'collapse',      name: 'Collapse',       label: 'Expanded → Dormant / Compact', response: 0.36, zeta: 0.92 },
  { id: 'compactToIdle', name: 'CompactToIdle',  label: 'Compact → Dormant',          response: 0.34, zeta: 0.95 },
  { id: 'toHud',         name: 'ToHud',          label: 'Any → HUD',                  response: 0.30, zeta: 0.68 },
  { id: 'fromHud',       name: 'FromHud',        label: 'HUD → previous state',       response: 0.38, zeta: 0.88 },

const springParams = s => {
  const m = 1;
  const k = Math.pow((2 * Math.PI) / s.response, 2) * m;
  const c = (4 * Math.PI * s.zeta * m) / s.response;

  if (from === 'hud') return SMAP.fromHud;
  if (to === 'expanded') return SMAP.toExpanded;
  if (from === 'expanded') return SMAP.collapse;
  if (from === 'idle' && to === 'compact') return SMAP.idleToCompact;
  if (from === 'compact' && to === 'idle') return SMAP.compactToIdle;
  return SMAP.toExpanded;

function simulate(s, T = 1.4, dt = 1 / 1000) {
  const { k, c, m } = springParams(s);
  let x = 0, v = 0, t = 0, peak = 0, settle = 0;
  const pts = [];
  while (t <= T) {
    if (Math.round(t * 1000) % 10 === 0) pts.push([t, x]);
    const a = (-k * (x - 1) - c * v) / m; v += a * dt; x += v * dt; t += dt;
    peak = Math.max(peak, x);
    if (Math.abs(x - 1) > 0.005) settle = t;
  }
  return { pts, overshoot: Math.max(0, peak - 1), settle };

/* ---------- element geometry (local coords, origin = top-left of island body) ---------- */
const R = (id, name, x, y, w, h, rx, token, note) => ({ id, name, x, y, w, h, rx, token, note });

  R('tabSel', 'Active tab pill', 18 + 84 * t, 14, 80, 18, 9, 'pill', 'x = 18 + 84 × tabIndex. Slides on tab change'),

  R('tab1', 'Tab · Telemetry', 100, 12, 84, 22, 0, 'label', 'Label centered, 11/600'),
  R('tab2', 'Tab · Drop Tray', 184, 12, 84, 22, 0, 'label', 'Label centered, 11/600'),
  R('clock', 'Clock', 304, 12, 80, 22, 0, 'label2', 'Right-aligned, 11/600 tabular'),

const LAYOUTS = [
  { key: 'idle', state: 'idle', title: 'Dormant', cpp: 'Idle', els: [

    R('status', 'Status dot', 138, 11, 6, 6, 3, 'aqua', 'Opacity 0.85, sky glow'),

  { key: 'compact', state: 'compact', title: 'Compact media', cpp: 'Compact', els: [

    R('wave', 'Waveform group', 209, 9, 21, 16, 0, 'sky', 'Envelope of the 4 bars'),

  ]},
  { key: 'exp-now', state: 'expanded', tab: 0, title: 'Expanded · Now Playing', cpp: 'ExpandedNowPlaying', els: [
    ...expHeader(0),
    R('art', 'Album art', 16, 46, 64, 64, 12, 'label', 'Bitmap brush clipped to rounded rect'),
    R('title', 'Song title', 92, 47, 176, 18, 0, 'label', 'Serif 15/600, trim with ellipsis'),
    R('artist', 'Artist', 92, 66, 176, 14, 0, 'label2', '12/500, trim with ellipsis'),
    R('scrubHit', 'Scrub hit area', 92, 82, 176, 16, 0, 'fill', 'Invisible. Pointer capture on press'),
    R('scrubTrack', 'Scrub track', 92, 88, 176, 4, 2, 'track', ''),
    R('scrubFill', 'Scrub fill', 92, 88, 176, 4, 2, 'sky', 'Width = 176 × progress'),
    R('knob', 'Scrub knob', 87, 85, 10, 10, 5, 'label', 'Center x = 92 + 176 × progress, y = 90'),
    R('elapsed', 'Elapsed time', 92, 96, 40, 11, 0, 'label3', '10/500 tabular, left'),
    R('remain', 'Remaining time', 228, 96, 40, 11, 0, 'label3', '10/500 tabular, right'),
    R('prev', 'Previous', 130, 112, 24, 24, 12, 'label', 'Glyph 12 DIP. Press: Selected pill fill, scale 0.88'),
    R('play', 'Play / Pause', 166, 110, 28, 28, 14, 'label', 'Glyph 14 DIP'),
    R('next', 'Next', 206, 112, 24, 24, 12, 'label', 'Glyph 12 DIP'),
    R('divider', 'Column divider', 276, 46, 1, 90, 0, 'fill', ''),
    R('cpuRing', 'CPU ring', 290, 48, 40, 40, 20, 'sky', 'Stroke 3.5, arc starts at 12 o\'clock. Value centered'),
    R('ramRing', 'RAM ring', 338, 48, 40, 40, 20, 'sky', 'Stroke 3.5. Value centered'),

    R('ramLabel', 'RAM label', 338, 92, 40, 11, 0, 'label3', 'Micro label, centered'),
    R('gpuLabel', 'GPU label + value', 290, 108, 88, 11, 0, 'label2', 'Label left, value right'),

  { key: 'exp-tele', state: 'expanded', tab: 1, title: 'Expanded · Telemetry', cpp: 'ExpandedTelemetry', els: [
    ...expHeader(1),
    ...['CPU', 'RAM', 'GPU', 'NET'].flatMap((n, i) => {
      const y = 46 + 22 * i;
      return [
        R('row' + i + 'Label', n + ' label', 16, y, 120, 12, 0, 'label2', 'Micro label'),

  const s = STATES[layout.state];

    R('body', 'Island body', 0, 0, s.w, s.h, s.rb, s.mix ? 'obsidian' : 'core', 'Bottom corners: continuous curve, see geometry recipe'),

/* ---------- island outline: shared by SVG preview and C++ builder ---------- */
function islandPath(W, H, rb, e) {
  e = Math.max(0, e); rb = Math.max(0, rb);
  const c = Math.max(0, Math.min(rb * 1.25, W / 2, H - e));
  const k = 0.30 * c;
  const n = v => +v.toFixed(3);
  return `M ${n(-e)} 0 H ${n(W + e)} A ${n(e)} ${n(e)} 0 0 0 ${n(W)} ${n(e)} V ${n(H - c)} C ${n(W)} ${n(H - k)} ${n(W - k)} ${n(H)} ${n(W - c)} ${n(H)} H ${n(c)} C ${n(k)} ${n(H)} 0 ${n(H - k)} 0 ${n(H - c)} V ${n(e)} A ${n(e)} ${n(e)} 0 0 0 ${n(-e)} 0 Z`;
}

/* ---------- spring-driven geometry ---------- */
const GKEYS = ['w', 'h', 'rb', 'ear', 'mix', 'rim', 'shadow'];
const pickG = s => Object.fromEntries(GKEYS.map(k => [k, s[k]]));
function useSpringGeom(stateId, reduced) {
  const cur = useRef(pickG(STATES[stateId]));
  const vel = useRef(Object.fromEntries(GKEYS.map(k => [k, 0])));
  const prev = useRef(stateId);
  const raf = useRef(0);
  const [g, setG] = useState(cur.current);
  const [active, setActive] = useState(null);
  useEffect(() => {
    const from = prev.current, to = stateId; prev.current = to;
    if (from === to) return;
    const sp = pickSpring(from, to); const P = springParams(sp);
    const target = STATES[to];
    cancelAnimationFrame(raf.current);
    if (reduced) { cur.current = pickG(target); GKEYS.forEach(k => vel.current[k] = 0); setG({ ...cur.current }); return; }
    setActive(sp.id);
    let last = performance.now();
    const tick = now => {
      let dt = Math.min((now - last) / 1000, 1 / 20); last = now;
      while (dt > 1e-6) {
        const h = Math.min(1 / 240, dt); dt -= h;
        for (const k of GKEYS) {
          const a = (-P.k * (cur.current[k] - target[k]) - P.c * vel.current[k]) / P.m;
          vel.current[k] += a * h; cur.current[k] += vel.current[k] * h;
        }
      }
      const settled = GKEYS.every(k => Math.abs(cur.current[k] - target[k]) < 0.01 && Math.abs(vel.current[k]) < 0.01);
      if (settled) { cur.current = pickG(target); GKEYS.forEach(k => vel.current[k] = 0); setG({ ...cur.current }); setActive(null); return; }
      setG({ ...cur.current });
      raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
  }, [stateId]);
  useEffect(() => () => cancelAnimationFrame(raf.current), []);
  return [g, active];
}

/* ---------- C++ export ---------- */
const pascal = s => s.charAt(0).toUpperCase() + s.slice(1);
const F = n => (Number.isInteger(n) ? n.toFixed(1) : String(+n.toFixed(3))) + 'f';
function cppExport() {
  const o = [];
  o.push('// Notch Island — generated from the design system sheet.');
  o.push('// Units are DIPs. Multiply by (dpi / 96.0f) only if you draw in raw pixels;');
  o.push('// ID2D1RenderTarget::SetDpi() does this for you.');
  o.push('// Local space: origin = top-left of the island BODY. Ears sit at x = -ear and x = width.');
  o.push('// D2D1_RECT_F is { left, top, right, bottom } — NOT { x, y, w, h }.');
  o.push('#pragma once');
  o.push('#include <d2d1.h>');
  o.push('#include <algorithm>');
  o.push('#include <cmath>');
  o.push('');
  o.push('namespace NotchIsland {');
  o.push('');
  o.push('struct IslandGeom { float width, height, bottomRadius, earRadius, surfaceMix, rim, shadow; };');
  STATE_ORDER.forEach(id => { const s = STATES[id]; o.push(`constexpr IslandGeom kGeom${pascal(id)} { ${[s.w, s.h, s.rb, s.ear, s.mix, s.rim, s.shadow].map(F).join(', ')} };`); });
  o.push('');
  o.push('// Screen anchor: left = floor((monitorWidthDip - geom.width) / 2), top = monitor work-area top (0).');
  o.push('');
  LAYOUTS.forEach(l => {
    o.push(`namespace ${l.cpp} {`);
    l.els.forEach(e => {
      const rect = `{ ${F(e.x)}, ${F(e.y)}, ${F(e.x + e.w)}, ${F(e.y + e.h)} }`;
      if (e.rx > 0) o.push(`  constexpr D2D1_ROUNDED_RECT ${pascal(e.id)} = { ${rect}, ${F(e.rx)}, ${F(e.rx)} }; // ${e.name}`);
      else o.push(`  constexpr D2D1_RECT_F ${pascal(e.id)} = ${rect}; // ${e.name}`);
    });
    o.push('}');
  });
  o.push('');
  o.push('namespace Color { // straight (non-premultiplied) alpha');
  COLORS.forEach(c => { const f = d2dFloats(c); o.push(`  constexpr D2D1_COLOR_F ${pascal(c.id)} = { ${f.map(v => v + 'f').join(', ')} }; // ${c.hex} @ ${c.a}`); });
  o.push('}');
  o.push('');
  o.push('struct SpringParams { float stiffness, damping, mass; };');
  o.push('namespace Spring {');
  SPRINGS.forEach(s => { const p = springParams(s); o.push(`  constexpr SpringParams ${s.name} { ${p.k.toFixed(1)}f, ${p.c.toFixed(2)}f, 1.0f }; // response ${s.response}s, damping ratio ${s.zeta}`); });
  o.push('}');
  o.push('');
  o.push('struct SpringValue { float x, v, target; };');
  o.push('// Semi-implicit Euler. Run at a fixed dt = 1/240 s, accumulating real frame time.');
  o.push('inline void StepSpring(SpringValue& s, const SpringParams& p, float dt) {');
  o.push('  const float a = (-p.stiffness * (s.x - s.target) - p.damping * s.v) / p.mass;');
  o.push('  s.v += a * dt;');
  o.push('  s.x += s.v * dt;');
  o.push('}');
  o.push('inline bool IsSettled(const SpringValue& s) {');
  o.push('  return std::fabs(s.x - s.target) < 0.01f && std::fabs(s.v) < 0.01f;');
  o.push('}');
  o.push('');
  o.push('// Outline with concave "liquid ears" and continuous-curvature bottom corners.');
  o.push('// Rebuild every animation frame from the sprung width/height/radii.');
  o.push('inline HRESULT BuildIslandGeometry(ID2D1Factory* factory, float W, float H, float rb, float e,');
  o.push('                                   ID2D1PathGeometry** out) {');
  o.push('  e  = (std::max)(0.0f, e);');
  o.push('  const float c = (std::max)(0.0f, (std::min)({ rb * 1.25f, W * 0.5f, H - e })); // corner extent');
  o.push('  const float k = 0.30f * c;                                                    // handle offset from corner');
  o.push('  ID2D1PathGeometry* geo = nullptr;');
  o.push('  HRESULT hr = factory->CreatePathGeometry(&geo);');
  o.push('  if (FAILED(hr)) return hr;');
  o.push('  ID2D1GeometrySink* s = nullptr;');
  o.push('  hr = geo->Open(&s);');
  o.push('  if (FAILED(hr)) { geo->Release(); return hr; }');
  o.push('  s->BeginFigure(D2D1::Point2F(-e, 0), D2D1_FIGURE_BEGIN_FILLED);');
  o.push('  s->AddLine(D2D1::Point2F(W + e, 0));');
  o.push('  if (e > 0) s->AddArc(D2D1::ArcSegment(D2D1::Point2F(W, e), D2D1::SizeF(e, e), 0.0f,');
  o.push('                       D2D1_SWEEP_DIRECTION_COUNTER_CLOCKWISE, D2D1_ARC_SIZE_SMALL));');
  o.push('  s->AddLine(D2D1::Point2F(W, H - c));');
  o.push('  s->AddBezier(D2D1::BezierSegment(D2D1::Point2F(W, H - k), D2D1::Point2F(W - k, H), D2D1::Point2F(W - c, H)));');
  o.push('  s->AddLine(D2D1::Point2F(c, H));');
  o.push('  s->AddBezier(D2D1::BezierSegment(D2D1::Point2F(k, H), D2D1::Point2F(0, H - k), D2D1::Point2F(0, H - c)));');
  o.push('  s->AddLine(D2D1::Point2F(0, e));');
  o.push('  if (e > 0) s->AddArc(D2D1::ArcSegment(D2D1::Point2F(-e, 0), D2D1::SizeF(e, e), 0.0f,');
  o.push('                       D2D1_SWEEP_DIRECTION_COUNTER_CLOCKWISE, D2D1_ARC_SIZE_SMALL));');
  o.push('  s->EndFigure(D2D1_FIGURE_END_CLOSED);');
  o.push('  hr = s->Close();');
  o.push('  s->Release();');
  o.push('  if (FAILED(hr)) { geo->Release(); return hr; }');
  o.push('  *out = geo;');
  o.push('  return S_OK;');
  o.push('}');
  o.push('');
  o.push('// Surface color for a sprung mix value m in [0, 1]:');
  o.push('//   rgb = lerp(Core.rgb, Obsidian.rgb, m), a = lerp(1.0, 0.92, m)');
  o.push('// Rim: linear gradient brush y 0 -> H, alpha 0.12 -> 0.04, multiplied by geom.rim.');
  o.push('// Draw it as a 2-DIP stroke inside PushLayer(geometric mask = island) so only 1 DIP shows.');
  o.push('');
  o.push('} // namespace NotchIsland');
  return o.join('\n');
}

function CopyBtn({ text, label = 'Copy' }) {

    function selectPre() { const pre = document.getElementById('cpp'); if (!pre) return; const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }}>{done ? 'Copied' : label}</button>;

function SpringChart({ sel }) {
  const W = 560, H = 220, pl = 40, pr = 14, pt = 14, pb = 30;
  const T = 1.2, Y = 1.15;
  const sx = t => pl + (t / T) * (W - pl - pr);
  const sy = v => pt + (1 - v / Y) * (H - pt - pb);
  const sims = SPRINGS.map(s => ({ s, r: simulate(s, T) }));
  return <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', maxWidth: W, height: 'auto', display: 'block' }} role="img" aria-label="Spring step response curves">
    {[0, 0.25, 0.5, 0.75, 1].map(v => <g key={v}>
      <line x1={pl} x2={W - pr} y1={sy(v)} y2={sy(v)} stroke="var(--line)" />
      <text x={pl - 8} y={sy(v) + 3.5} textAnchor="end" fill="var(--dim)" style={{ font: '10px var(--mono)' }}>{v.toFixed(2)}</text>
    </g>)}
    {[0, 200, 400, 600, 800, 1000, 1200].map(ms => <text key={ms} x={sx(ms / 1000)} y={H - 10} textAnchor="middle" fill="var(--dim)" style={{ font: '10px var(--mono)' }}>{ms}ms</text>)}
    <line x1={pl} x2={W - pr} y1={sy(1)} y2={sy(1)} stroke="var(--muted)" strokeDasharray="3 3" />
    {sims.map(({ s, r }) => {
      const on = s.id === sel;
      const d = r.pts.map(([t, x], i) => `${i ? 'L' : 'M'}${sx(t).toFixed(1)} ${sy(Math.max(0, x)).toFixed(1)}`).join(' ');
      return <path key={s.id} d={d} fill="none" stroke={on ? 'var(--accent)' : 'var(--line-2)'} strokeWidth={on ? 2.2 : 1} style={on ? { filter: 'drop-shadow(0 0 4px rgba(56,189,248,.5))' } : null} />;
    })}
    {(() => { const r = sims.find(x => x.s.id === sel).r; return <g>
      <line x1={sx(r.settle)} x2={sx(r.settle)} y1={pt} y2={H - pb} stroke="var(--accent)" strokeOpacity=".5" strokeDasharray="2 3" />
      <circle cx={sx(r.settle)} cy={sy(1)} r="3.5" fill="var(--accent)" />
      <text x={Math.min(sx(r.settle) + 6, W - 110)} y={pt + 10} fill="var(--accent)" style={{ font: '10px var(--mono)' }}>settles {Math.round(r.settle * 1000)}ms</text>
    </g>; })()}
  </svg>;
}

/* ============================================================ */
function App() {
  const reduced = useMemo(() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } }, []);
  const [base, setBase] = useState('expanded');
  const [tab, setTab] = useState(0);
  const [hudMode, setHudMode] = useState('volume');
  const [flash, setFlash] = useState(false);
  const [peek, setPeek] = useState(false);
  const [live, setLive] = useState(true);
  const [inspect, setInspect] = useState(true);
  const [grid, setGrid] = useState(false);
  const [zoom, setZoom] = useState(() => (window.innerWidth >= 1180 ? 2 : 1));
  const [screenW, setScreenW] = useState(1920);
  const [cursor, setCursor] = useState(null);
  const [pin, setPin] = useState(null);
  const [media, setMedia] = useState({ idx: 0, pos: 71, playing: true });
  const [tele, setTele] = useState({ cpu: 34, ram: 58, gpu: 41, net: 22 });
  const [levels, setLevels] = useState({ volume: 64, brightness: 72 });
  const [pomo, setPomo] = useState({ left: 18 * 60 + 42, total: 25 * 60 });
  const [selSpring, setSelSpring] = useState('toExpanded');
  const [tableKey, setTableKey] = useState(null);
  const [clock, setClock] = useState('');
  const flashT = useRef(0);
  const bodyRef = useRef(null);

  const current = (base === 'hud' || flash) ? 'hud' : (live && peek && (base === 'idle' || base === 'compact')) ? 'expanded' : base;
  const layoutKey = current === 'idle' ? 'idle' : current === 'compact' ? 'compact' : current === 'expanded' ? ['exp-now', 'exp-tele', 'exp-tray'][tab] : (hudMode === 'pomodoro' ? 'hud-pomo' : 'hud-level');
  const layout = LAYOUTS.find(l => l.key === layoutKey);
  const [g, activeSpring] = useSpringGeom(current, reduced);
  useEffect(() => { if (activeSpring) setSelSpring(activeSpring); }, [activeSpring]);

  // clocks & simulated data
  useEffect(() => {
    const tick = () => { const d = new Date(); setClock(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })); };
    tick(); const a = setInterval(tick, 10000);
    const b = setInterval(() => setTele(t => ({
      cpu: Math.max(4, Math.min(96, t.cpu + (Math.random() - .5) * 14)),
      ram: Math.max(30, Math.min(88, t.ram + (Math.random() - .5) * 4)),
      gpu: Math.max(3, Math.min(95, t.gpu + (Math.random() - .5) * 16)),
      net: Math.max(1, Math.min(98, t.net + (Math.random() - .5) * 22)),
    })), 1400);
    const c = setInterval(() => setPomo(p => ({ ...p, left: p.left > 0 ? p.left - 1 : p.total })), 1000);
    return () => { clearInterval(a); clearInterval(b); clearInterval(c); };
  }, []);
  useEffect(() => {
    if (!media.playing) return;
    const id = setInterval(() => setMedia(m => {
      const d = TRACKS[m.idx].dur;
      return m.pos + 0.25 >= d ? { ...m, idx: (m.idx + 1) % TRACKS.length, pos: 0 } : { ...m, pos: m.pos + 0.25 };
    }), 250);
    return () => clearInterval(id);
  }, [media.playing]);
  useEffect(() => {
    const k = e => {
      if (e.target.closest && e.target.closest('input,select,textarea')) return;
      const i = ['1', '2', '3', '4'].indexOf(e.key);
      if (i >= 0) { setBase(STATE_ORDER[i]); setFlash(false); }
    };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, []);

  const triggerHud = (mode) => {
    setHudMode(mode);
    if (mode === 'volume') setLevels(l => ({ ...l, volume: Math.min(100, l.volume + 6 > 100 ? 18 : l.volume + 6) }));
    if (mode === 'brightness') setLevels(l => ({ ...l, brightness: l.brightness + 8 > 100 ? 24 : l.brightness + 8 }));
    if (base === 'hud') return;
    setFlash(true); clearTimeout(flashT.current); flashT.current = setTimeout(() => setFlash(false), 1800);
  };
  const focusLayout = (l, id) => {
    clearTimeout(flashT.current); setFlash(false);
    setBase(l.state);
    if (l.tab !== undefined) setTab(l.tab);
    if (l.hud === 'pomodoro') setHudMode('pomodoro');
    if (l.hud === 'level' && hudMode === 'pomodoro') setHudMode('volume');
    setPin(id || null);
  };
  const scrub = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const p = clamp01((e.clientX - r.left) / r.width);
    setMedia(m => ({ ...m, pos: p * TRACKS[m.idx].dur }));
  };
  const skip = d => setMedia(m => ({ ...m, idx: (m.idx + d + TRACKS.length) % TRACKS.length, pos: 0 }));

  // inspector hit-test
  const frameEls = withFrame(layout);
  const onMove = e => {
    const el = bodyRef.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / zoom, y = (e.clientY - r.top) / zoom;
    if (x < -g.ear - 6 || x > g.w + g.ear + 6 || y > g.h + 6 || y < -2) { setCursor(null); return; }
    setCursor({ x, y });
  };
  const hit = cursor ? frameEls.filter(el => el.id !== 'body' && cursor.x >= el.x && cursor.x <= el.x + el.w && cursor.y >= el.y && cursor.y <= el.y + el.h).sort((a, b) => a.w * a.h - b.w * b.h)[0] : null;
  const hovered = hit || (cursor && cursor.x >= 0 && cursor.x <= g.w && cursor.y <= g.h ? frameEls[0] : null);
  const focusEl = (pin && frameEls.find(e => e.id === pin)) || hovered;

  const S = STATES[current];
  const d = islandPath(g.w, g.h, g.rb, g.ear);
  const mix = clamp01(g.mix);
  const surface = `rgba(${Math.round(12 * mix)}, ${Math.round(12 * mix)}, ${Math.round(14 * mix)}, ${(1 - 0.08 * mix).toFixed(3)})`;
  const stageH = (145 + 46) * zoom + 14;
  const stageMinW = (400 + 28 + 120) * zoom;
  const originX = Math.floor((screenW - S.w) / 2);
  const tKey = tableKey || layoutKey;
  const tLayout = LAYOUTS.find(l => l.key === tKey);
  const tEls = withFrame(tLayout);
  const tState = STATES[tLayout.state];
  const tOrigin = Math.floor((screenW - tState.w) / 2);
  const cpp = useMemo(cppExport, []);

  return <>
    <header className="flex flex-wrap items-end justify-between gap-4">
      <div style={{ minWidth: 0 }}>
        <p className="eyebrow">Design system · handoff sheet · v0.1</p>
        <h1 className="mt-2 text-[34px] leading-[1.05] font-semibold tracking-[-0.02em]">Notch Island</h1>
        <p className="mt-2 text-[13.5px]" style={{ color: 'var(--muted)', maxWidth: '62ch' }}>Top-center overlay for Windows, drawn to be rebuilt in Direct2D. Every measurement on this page is in DIPs and comes from one spec object, so the preview and the tables can't drift apart.</p>
      </div>
      <div className="flex flex-wrap gap-2 items-center">
        <label className="eyebrow" htmlFor="sw">Screen width</label>
        <select id="sw" className="chip mono" value={screenW} onChange={e => setScreenW(+e.target.value)}>
          {[1366, 1536, 1920, 2560, 3440].map(w => <option key={w} value={w}>{w} DIP</option>)}
        </select>
      </div>
    </header>

    {/* toolbar */}
    <div className="mt-8 flex flex-wrap gap-3 items-center justify-between">
      <div className="seg" role="group" aria-label="Island state">
        {STATE_ORDER.map(id => { const s = STATES[id]; return (
          <button key={id} aria-pressed={base === id} onClick={() => { setBase(id); setFlash(false); setPin(null); }}>
            <span className="k">{s.n}</span>{s.name}<span className="mono" style={{ fontSize: 10.5, color: 'var(--dim)' }}>{s.w}×{s.h}</span>
          </button>); })}
      </div>
      <div className="flex flex-wrap gap-2">
        <button className="chip" onClick={() => triggerHud('volume')}>Volume key</button>
        <button className="chip" onClick={() => triggerHud('brightness')}>Brightness key</button>
        <button className="chip" onClick={() => triggerHud('pomodoro')}>Pomodoro alert</button>
      </div>
    </div>
    <div className="mt-3 flex flex-wrap gap-2 items-center">
      <button className="chip" aria-pressed={live} onClick={() => setLive(v => !v)}>Hover to expand {live ? 'on' : 'off'}</button>
      <button className="chip" aria-pressed={inspect} onClick={() => setInspect(v => !v)}>Bounds {inspect ? 'on' : 'off'}</button>
      <button className="chip" aria-pressed={grid} onClick={() => setGrid(v => !v)}>10 DIP grid</button>
      <div className="seg" role="group" aria-label="Zoom">
        {[1, 2, 3].map(z => <button key={z} aria-pressed={zoom === z} onClick={() => setZoom(z)}>{z}×</button>)}
      </div>
      <span className="text-[12px]" style={{ color: 'var(--dim)' }}>Keys 1–4 switch states. In Dormant or Compact, hover the island to peek.</span>
    </div>

    {/* stage + inspector */}
    <div className="mt-4 grid gap-4" style={{ gridTemplateColumns: 'minmax(0, 1fr)' }}>
      <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_300px]">
        <div className="stage-scroll" style={{ minWidth: 0 }}>
          <div className="stage" style={{ height: stageH, minWidth: stageMinW }} onMouseMove={onMove} onMouseLeave={() => setCursor(null)}>
            <div className="bezel" />
            <div className={'screen' + (grid ? ' grid' : '')} style={grid ? { ['--g']: 0 } : null}>
              {grid && <style>{`.screen.grid::after{background-size:${10 * zoom}px ${10 * zoom}px}`}</style>}
            </div>
            {/* island, flush at screen Y = 0 (below the 14px bezel strip) */}
            <div style={{ position: 'absolute', top: 14, left: '50%', width: g.w, height: g.h, transform: `translateX(-50%) scale(${zoom})`, transformOrigin: '50% 0', zIndex: 2 }}
              onMouseEnter={() => setPeek(true)} onMouseLeave={() => setPeek(false)}>
              <svg width={g.w + 2 * g.ear} height={g.h} viewBox={`${-g.ear} 0 ${g.w + 2 * g.ear} ${g.h}`}
                style={{ position: 'absolute', left: -g.ear, top: 0, overflow: 'visible', filter: `drop-shadow(0 12px 32px rgba(0,0,0,${(0.55 * clamp01(g.shadow)).toFixed(3)}))` }}>
                <defs>
                  <clipPath id="islClip"><path d={d} /></clipPath>
                  <linearGradient id="rimGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2={g.h}>
                    <stop offset="0" stopColor="#fff" stopOpacity={0.12 * clamp01(g.rim)} />
                    <stop offset="1" stopColor="#fff" stopOpacity={0.04 * clamp01(g.rim)} />
                  </linearGradient>
                </defs>
                <path d={d} fill={surface} />
                <path d={d} fill="none" stroke="url(#rimGrad)" strokeWidth="2" clipPath="url(#islClip)" />
              </svg>
              <div ref={bodyRef} className="isl" style={{ position: 'absolute', left: 0, top: 0, width: g.w, height: g.h, clipPath: `path('${d}')` }}>
                <div key={layoutKey} className="fade" style={{ position: 'absolute', inset: 0 }}>
                  <IslandContent layoutKey={layoutKey} media={media} tele={tele} hudMode={hudMode} levels={levels} pomo={pomo}
                    setTab={setTab} clock={clock} scrub={scrub} skip={skip} togglePlay={() => setMedia(m => ({ ...m, playing: !m.playing }))} />
                </div>
              </div>
              {inspect && !activeSpring && <div style={{ position: 'absolute', left: 0, top: 0, width: S.w, height: S.h, pointerEvents: 'none' }}>
                {frameEls.filter(el => el.id !== 'body').map(el => {
                  const on = focusEl && focusEl.id === el.id;
                  return <div key={el.id} style={{ ...B(el), border: `${1 / zoom}px ${on ? 'solid' : 'dashed'} ${on ? CMAP.aqua.hex : 'rgba(56,189,248,.38)'}`, background: on ? 'rgba(0,255,255,.10)' : 'transparent', borderRadius: Math.min(el.rx, el.h / 2), boxSizing: 'border-box', opacity: (el.id === 'earL' || el.id === 'earR') && !on ? 0 : 1 }} />;
                })}
                {focusEl && focusEl.id === 'body' && <div style={{ position: 'absolute', inset: 0, outline: `${1 / zoom}px solid ${CMAP.aqua.hex}`, borderRadius: `0 0 ${S.rb}px ${S.rb}px` }} />}
              </div>}
            </div>
            {/* dimension label */}
            <div className="mono" style={{ position: 'absolute', left: '50%', top: 14 + g.h * zoom + 12, transform: 'translateX(-50%)', fontSize: 11, color: 'var(--muted)', background: 'rgba(7,8,10,.7)', padding: '4px 8px', borderRadius: 6, border: '1px solid var(--line)', whiteSpace: 'nowrap', zIndex: 3 }}>
              {g.w.toFixed(activeSpring ? 1 : 0)} × {g.h.toFixed(activeSpring ? 1 : 0)} · r {g.rb.toFixed(activeSpring ? 1 : 0)} · ear {g.ear.toFixed(activeSpring ? 1 : 0)}
            </div>
          </div>
        </div>

        <aside className="panel p-4" style={{ minWidth: 0 }} aria-live="polite">
          <p className="eyebrow">Inspector</p>
          <div className="mt-3 text-[15px] font-semibold">{S.n} · {layout.title}</div>
          <dl className="kv mt-3">
            <dt>Body W × H</dt><dd>{S.w} × {S.h}</dd>
            <dt>Bottom radius</dt><dd>{S.rb}</dd>
            <dt>Ear radius</dt><dd>{S.ear}</dd>
            <dt>Envelope</dt><dd>{S.w + 2 * S.ear} × {S.h}</dd>
            <dt>Screen rect</dt><dd>{`{${originX}, 0, ${originX + S.w}, ${S.h}}`}</dd>
            <dt>Spring</dt><dd style={{ color: activeSpring ? 'var(--accent)' : 'var(--fg)' }}>{activeSpring ? SMAP[activeSpring].label : 'at rest'}</dd>
            <dt>Cursor (local)</dt><dd>{cursor ? `${cursor.x.toFixed(1)}, ${cursor.y.toFixed(1)}` : '—'}</dd>
          </dl>

              </dl>
              {focusEl.note && <p className="mt-3 text-[12px]" style={{ color: 'var(--muted)' }}>{focusEl.note}</p>}
              {pin && <button className="chip mt-3" onClick={() => setPin(null)}>Unpin</button>}
            </> : <p className="mt-2 text-[12.5px]" style={{ color: 'var(--muted)' }}>Hover the island to read any element's box, or click a row in the element table to pin it.</p>}
          </div>
        </aside>
      </div>
    </div>

    {/* ===== Handoff ===== */}

          <thead><tr><th>State</th><th className="text-right">W</th><th className="text-right">H</th><th className="text-right">Bottom r</th><th className="text-right">Ear r</th><th>Body D2D1_RECT_F</th><th>Screen rect @ {screenW}</th><th>Surface</th><th className="text-right">Rim</th><th className="text-right">Shadow</th></tr></thead>
          <tbody>
            {STATE_ORDER.map(id => { const s = STATES[id]; const ox = Math.floor((screenW - s.w) / 2); return (
              <tr key={id} className={'row' + (current === id ? ' on' : '')} onClick={() => { setBase(id); setFlash(false); setPin(null); }}>
                <td><span className="mono" style={{ color: 'var(--accent)' }}>{s.n}</span>&nbsp;&nbsp;{s.name}</td>
                <td className="num">{s.w}</td><td className="num">{s.h}</td><td className="num">{s.rb}</td><td className="num">{s.ear}</td>
                <td className="code">{`{0, 0, ${s.w}, ${s.h}}`}</td>
                <td className="code">{`{${ox}, 0, ${ox + s.w}, ${s.h}}`}</td>
                <td>{s.mix ? 'Obsidian' : 'Core'}</td>
                <td className="num">{s.rim}</td><td className="num">{s.shadow}</td>
              </tr>); })}
          </tbody>
        </table>
      </div>
      <div className="mt-5 grid gap-5 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)]">
        <div className="panel p-5" style={{ minWidth: 0 }}>
          <p className="eyebrow">Outline recipe</p>
          <svg viewBox="-40 -14 300 120" style={{ width: '100%', height: 'auto', marginTop: 12 }} role="img" aria-label="Island outline construction">
            <line x1="-40" x2="260" y1="0" y2="0" stroke="var(--line-2)" />
            <text x="-36" y="-4" fill="var(--dim)" style={{ font: '7px var(--mono)' }}>screen y = 0</text>
            <path d={islandPath(200, 80, 28, 18)} fill="#000" stroke="var(--accent)" strokeWidth=".8" />
            <circle cx="-18" cy="18" r="18" fill="none" stroke="var(--muted)" strokeDasharray="2 2" strokeWidth=".6" />
            <circle cx="218" cy="18" r="18" fill="none" stroke="var(--muted)" strokeDasharray="2 2" strokeWidth=".6" />
            {(() => { const c = 35, k = 0.3 * c; return <g fill="var(--aqua)">
              {[[200, 80 - c], [200, 80 - k], [200 - k, 80], [200 - c, 80]].map(([x, y], i) => <circle key={i} cx={x} cy={y} r="1.8" />)}
              <path d={`M200 ${80 - k} L200 80 L${200 - k} 80`} fill="none" stroke="var(--aqua)" strokeWidth=".5" strokeDasharray="1.5 1.5" />
            </g>; })()}
            <text x="-36" y="46" fill="var(--muted)" style={{ font: '7px var(--mono)' }}>ear arc, center (−e, e)</text>
            <text x="150" y="104" fill="var(--muted)" style={{ font: '7px var(--mono)' }}>extent c = 1.25 r, handles 0.3 c</text>
          </svg>
        </div>
        <div className="panel p-5 prose text-[13px]" style={{ minWidth: 0 }}>
          <p className="eyebrow mb-3">How the shape is built</p>
          <p>The figure starts at <b>(−e, 0)</b>, runs along the screen edge to <b>(W + e, 0)</b>, then drops into the body through a concave arc of radius <b>e</b> centered at <b>(W + e, e)</b>. That arc is the ear: it makes the island read as poured from the bezel instead of stuck on it.</p>
          <p className="mt-3">Bottom corners are one cubic Bézier each, not a circular arc. The corner starts <b>c = 1.25 r</b> from the corner point and both handles sit <b>0.3 c</b> from it. At 45° this lands within 0.004 r of a circle of radius r, but the curvature ramps in gradually, which is what gives Apple's continuous-corner look.</p>
          <p className="mt-3">c is clamped to <b>min(1.25 r, W / 2, H − e)</b> so the curve never crosses the ears during a spring overshoot.</p>
        </div>
      </div>
    </Section>

    <Section eyebrow="02 · Layout" title="Element coordinates" aside={
      <div className="seg" role="group" aria-label="Layout">
        {LAYOUTS.map(l => <button key={l.key} aria-pressed={tKey === l.key} onClick={() => { setTableKey(l.key); focusLayout(l); }}>{l.title}</button>)}

      <p className="mb-3 text-[12.5px]" style={{ color: 'var(--muted)' }}>Local origin is the top-left of the island body. Screen X adds <span className="mono" style={{ color: 'var(--fg)' }}>{tOrigin}</span> for a {screenW} DIP wide monitor. Click a row to pin it in the preview.</p>
      <div className="panel tbl">

          <tbody>
            {tEls.map(el => (
              <tr key={el.id} className={'row' + (pin === el.id && tKey === layoutKey ? ' on' : '')} onClick={() => { focusLayout(tLayout, el.id); }}>

                <td className="num">{el.x}</td><td className="num">{el.y}</td><td className="num">{el.w}</td><td className="num">{el.h}</td><td className="num">{el.rx || '—'}</td>
                <td className="code">{`{${el.x}, ${el.y}, ${el.x + el.w}, ${el.y + el.h}}`}</td>
                <td className="num">{tOrigin + el.x}</td>

                <td style={{ color: 'var(--muted)', minWidth: 220 }}>{el.note}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Section>

    <Section eyebrow="03 · Color" title="Color tokens">
      <div className="panel tbl">
        <table className="spec">
          <thead><tr><th></th><th>Token</th><th>Hex</th><th className="text-right">Alpha</th><th>CSS</th><th>D2D1_COLOR_F</th><th>Use</th></tr></thead>
          <tbody>
            {COLORS.map(c => (
              <tr key={c.id}>
                <td><div className="swatch"><i style={{ background: rgba(c.id) }} /></div></td>
                <td style={{ whiteSpace: 'nowrap' }}>{c.name}<div className="mono" style={{ fontSize: 10.5, color: 'var(--dim)' }}>Color::{pascal(c.id)}</div></td>
                <td className="code">{c.hex}</td>
                <td className="num">{c.a.toFixed(2)}</td>
                <td className="code">{rgba(c.id)}</td>
                <td className="code">{`{ ${d2dFloats(c).map(v => v + 'f').join(', ')} }`}</td>
                <td style={{ color: 'var(--muted)', minWidth: 240 }}>{c.use}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Section>

    <Section eyebrow="04 · Type" title="Typography">
      <div className="panel tbl">
        <table className="spec">
          <thead><tr><th>Role</th><th>Sample</th><th>macOS family</th><th>Windows (DirectWrite)</th><th className="text-right">Size</th><th className="text-right">Weight</th><th className="text-right">Line</th><th>Tracking</th><th>Color</th></tr></thead>
          <tbody>
            {TYPE.map(t => (
              <tr key={t.role}>
                <td style={{ whiteSpace: 'nowrap' }}>{t.role}</td>
                <td style={{ whiteSpace: 'nowrap', font: `${t.weight} ${t.size}px/${t.lh}px ${t.mac === 'New York' ? 'var(--island-serif)' : 'var(--island-ui)'}`, color: rgba(t.color), textTransform: t.track.includes('caps') ? 'uppercase' : 'none', letterSpacing: t.track.includes('caps') ? '.6px' : 'normal', background: '#000', fontVariantNumeric: 'tabular-nums' }}>{t.role === 'Media title' ? 'Glass Harbor' : t.role.includes('value') ? '64 · 41%' : t.role === 'Timestamp' ? '1:11' : t.role === 'Micro label' ? 'CPU' : t.role === 'Artist' ? 'Mira Okonkwo' : 'Now Playing'}</td>
                <td>{t.mac}</td><td>{t.win}</td>
                <td className="num">{t.size}</td><td className="num">{t.weight}</td><td className="num">{t.lh}</td>
                <td className="mono" style={{ fontSize: 11.5 }}>{t.track}</td>
                <td>{CMAP[t.color].name}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="mt-3 text-[12.5px] prose" style={{ color: 'var(--muted)' }}>SF Pro and New York are licensed for Apple platforms only, so the Windows build can't ship them. Use Segoe UI Variable (built into Windows 11) or bundle Inter, and Georgia for the serif accent. Render text with grayscale antialiasing: ClearType does not work on a transparent surface.</p>
    </Section>

    <Section eyebrow="05 · Motion" title="Spring physics">
      <div className="grid gap-5 lg:grid-cols-[minmax(0,1.15fr)_minmax(0,1fr)]">
        <div className="panel tbl" style={{ minWidth: 0 }}>
          <table className="spec">
            <thead><tr><th>Transition</th><th className="text-right">Stiffness k</th><th className="text-right">Damping c</th><th className="text-right">Mass</th><th className="text-right">Response</th><th className="text-right">ζ</th><th className="text-right">Overshoot</th><th className="text-right">Settle</th></tr></thead>
            <tbody>
              {SPRINGS.map(s => { const p = springParams(s); const r = simulate(s); return (
                <tr key={s.id} className={'row' + (selSpring === s.id ? ' on' : '')} onClick={() => setSelSpring(s.id)}>
                  <td style={{ whiteSpace: 'nowrap' }}>{s.label}<div className="mono" style={{ fontSize: 10.5, color: 'var(--dim)' }}>Spring::{s.name}</div></td>
                  <td className="num">{p.k.toFixed(1)}</td><td className="num">{p.c.toFixed(2)}</td><td className="num">1.0</td>
                  <td className="num">{s.response}s</td><td className="num">{s.zeta}</td>
                  <td className="num">{(r.overshoot * 100).toFixed(1)}%</td><td className="num">{Math.round(r.settle * 1000)}ms</td>
                </tr>); })}
            </tbody>
          </table>
        </div>
        <div className="panel p-5" style={{ minWidth: 0 }}>
          <div className="flex flex-wrap items-center justify-between gap-2">
            <p className="eyebrow">Step response · {SMAP[selSpring].label}</p>
            <button className="chip" onClick={() => {
              const map = { idleToCompact: ['idle', 'compact'], toExpanded: ['compact', 'expanded'], collapse: ['expanded', 'compact'], compactToIdle: ['compact', 'idle'], toHud: ['idle', 'hud'], fromHud: ['hud', 'idle'] };
              const [a, b] = map[selSpring]; setFlash(false); setPin(null); setBase(a); setTimeout(() => setBase(b), 650);
            }}>Play in preview</button>
          </div>
          <div className="mt-3"><SpringChart sel={selSpring} /></div>
          <p className="mt-3 text-[12px]" style={{ color: 'var(--muted)' }}>Derived from response and damping ratio: k = (2π / response)² · m, c = 4π · ζ · m / response. Settle = last time the value is more than 0.5% off target. One spring drives width, height, both radii, surface mix, rim and shadow together, so the outline never shears.</p>
        </div>
      </div>
    </Section>

    <Section eyebrow="06 · Code" title="Direct2D constants" aside={<CopyBtn text={cpp} label="Copy header" />}>
      <pre className="code" id="cpp" tabIndex={0}>{cpp}</pre>
    </Section>

    <Section eyebrow="07 · Window" title="Handoff notes">
      <div className="grid gap-4 md:grid-cols-2">
        {[
          ['Coordinates are DIPs', 'Call SetDpi on the render target with the monitor DPI from GetDpiForWindow, then use every number on this page unchanged. Snap rect edges to whole pixels after scaling to keep the 1 DIP rim crisp.'],
          ['Size the window once', `Make the overlay window the largest envelope plus shadow room: ${400 + 28 + 64} × ${145 + 48} DIP, centered at the top of the work area. Animate the shape inside it. Resizing an HWND every frame stutters.`],
          ['Use DirectComposition', 'Create the swap chain with CreateSwapChainForComposition, DXGI_ALPHA_MODE_PREMULTIPLIED, and attach it to a DComp visual. Premultiply the token colors (rgb × a) before drawing into it.'],
          ['Click-through outside the shape', 'Answer WM_NCHITTEST with HTTRANSPARENT unless the point is inside the current island geometry (ID2D1Geometry::FillContainsPoint). Use WS_EX_TOOLWINDOW | WS_EX_TOPMOST | WS_EX_NOACTIVATE so it never steals focus or shows on the taskbar.'],
        ].map(([h, b]) => <div key={h} className="panel p-5" style={{ minWidth: 0 }}><h3 className="text-[14px] font-semibold">{h}</h3><p className="mt-2 text-[13px] prose">{b}</p></div>)}
      </div>
      <p className="mt-6 text-[11.5px]" style={{ color: 'var(--dim)' }}>Track names, artists and file names in the preview are placeholder examples. Telemetry values are simulated.</p>
    </Section>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body></html>
